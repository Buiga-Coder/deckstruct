name: Ubuntu
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-dejavu-core fonts-liberation
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
